<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Agricultural Dashboard</title>
  </head>
  <body>
<div class="d-flex ">
<div class="sidebar position-fixed">

<!-- Site Logo -->
<img src="Image/AgriNexus-Logo.png" alt="AgriNexus" width="200">

<!-- Menu -->
<div>
<a href="Agriculture.html">Dashboard</a>
  <a href="#Crops">Crops</a>
  <a href="#Farmers">Farmers</a>
  <a href="#Reports">Reports</a>
  <a href="#Settings">Setting</a>
</div>

  <!-- User Profile -->
  <div class="dropdown mb-5 align-items-center">
  <button class="btn text-white dropdown-toggle" type="button" id="profileDropdown" data-bs-toggle="dropdown">
    <i class="bi bi-person-circle user ms-2"></i>
  </button>
  <ul class="dropdown-menu dropdown-menu-end p-1 ms-1" aria-labelledby="profileDropdown" style="min-width: 240px;">
    <li class="d-flex align-items-center mb-2 ms-4">
      <img id="userAvatar" src="Image/Gojo-Avatar.png" alt="Avatar" class="rounded-circle me-2" width="80" height="80">
      <div>
        <div id="userName" class="fw-bold">User Name</div>
        <div id="userRole" class="text-muted small">User Role</div>
      </div>
      </li>
  </ul>
</div>
</div>
<div class="content">

<!-- Top Navbar -->
<section class="navbar">
    <button id="toggleSidebar" class="btn btn-success">☰</button>
    <div><h3 class="fw-bold">Dashboard</h3></div>
    <div><a><i class="bi bi-bell-fill fs-3 pe-3"></i></a>
    <a><i class="bi bi-box-arrow-right fs-3"></i></a></div>
</section>
<hr>

<!-- Static Cards -->
<section>
<div class="row mt-5 pt-3" id="statsSection">
  <div class="col">
    <div class="card shadow text-center p-3">
      <h6 class="text">Crops</h6>
      <h2 id="statCrops">0</h2>
    </div>
  </div>

  <div class="col">
    <div class="card shadow text-center p-3">
      <h6 class="text">Farms</h6>
      <h2 id="statFarms">0</h2>
    </div>
  </div>

  <div class="col">
    <div class="card shadow text-center p-3">
      <h6 class="text">Farmers</h6>
      <h2 id="statFarmers">0</h2>
    </div>
  </div>

  <div class="col">
    <div class="card shadow text-center p-3">
      <h6 class="text">Total Yield</h6>
      <h2 id="statYield">0</h2>
    </div>
  </div>
</div>
</section>

<!-- Charts -->
<section>
<div class="chart mt-5">
<div class="d-flex" style="width: 100%; height: 220px;">
<div>
<h3 class="fw-bold">BarChart</h3>
<canvas id="barChart"></canvas></div>
<div>
<h3 class="fw-bold">PieChart</h3>
<canvas id="pieChart"></canvas></div>
</div>
<div class="mt-5" style="width: 50%; height: 220px;">
<h3 class="fw-bold">LineChart</h3>
<canvas id="lineChart"></canvas></div>
</div>
</section>

<!-- Crops Table -->
<section class="p-3 mt-5">
<div class="row">
<div class="col-12">
<button class="btn newUser" data-bs-toggle="modal" data-bs-target="#userForm">Add User <i class="bi bi-person-plus-fill"></i></button>
<input id="searchCrop" class="form-control mb-2 mt-3" placeholder="Search crop...">
</div>
</div>
<div class="row">
<div class="col-12">
    <table class="table table-striped table-hover mt-3 text-center table-bordered">
    <thead>
    <tr>
    <th>Name</th>
    <th>Type</th>
    <th>Season</th>
    <th>Action</th>
    </tr>
    </thead>
    <tbody id="data"></tbody>
    </table>
</div></div>
 </section>
 <div class="modal fade" id="userForm">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Fill the Form</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form action="#" id="myForm">
                    <div class="inputField">
                        <div>
                            <label for="name">Name</label>
                            <input type="text" name="" id="showName" required>
                        </div>
                         <div>
                            <label for="email">Type</label>
                            <input type="text" name="" id="showEmail" required>
                        </div>
                        <div>
                            <label for="role">Season</label>
                            <input type="text" name="" id="showRole" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="submit" form="myForm" class="btn btn-primary submit">Submit</button>
            </div>
        </div>
    </div>
 </div>

 <div class="modal fade" id="readData">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Profile</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form action="#">
                    <div class="inputField">
                        <div>
                            <label for="name">Name</label>
                            <input type="text" name="" id="name" disabled>
                        </div>
                         <div>
                            <label for="email">Type</label>
                            <input type="text" name="" id="email" disabled>
                        </div>
                        <div>
                            <label for="role">Season</label>
                            <input type="text" name="" id="role" disabled>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
 </div>
</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/Agriculture.js"></script>
  </body>
</html>
